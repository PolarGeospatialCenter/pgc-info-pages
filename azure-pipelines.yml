# add branches to trigger builds here
trigger:
  branches:
    include:
      - master
      - dev
  paths:
    exclude:
      - "*.md"

pool:
  name: default

resources:
  repositories:
    - repository: configRepo
      type: github
      name: umn-pgc/pgc-info-pages-config # GitHub Org/Repo name
      endpoint: "github.com_umn-pgc" # Name of your Service Connection
      ref: main

jobs:
  - job: BuildAndPushImage
    displayName: Build and push image
    workspace:
      clean: all
    steps:
      - task: Docker@2
        inputs:
          containerRegistry: "pgc-docker.artifactory.umn.edu - pgcdocker"
          repository: "pgc-info-pages"
          command: "buildAndPush"
          Dockerfile: "**/Dockerfile"
          tags: "$(Build.SourceVersion)"
  - job: UpdateConfigRepo
    displayName: Update Application's Config Repo
    dependsOn:
      - BuildAndPushImage
    condition: succeeded('BuildAndPushImage')
    workspace:
      clean: all
    steps:
      - checkout: configRepo
        path: s/pgc-info-pages-config
        persistCredentials: true # Allows script steps to reuse pipeline credentials
      - bash: |
          NEW_TAG="$(Build.SourceVersion)"
          if [ "$(Build.SourceBranchName)" = "master" ]; then
            TARGET_OVERLAY="prd"
          else
            TARGET_OVERLAY="dev"
          fi
          echo "Updating Config Repo overlay: $TARGET_OVERLAY with tag: $NEW_TAG"
          cd $(Pipeline.Workspace)/s/pgc-info-pages-config
          # Run kustomize or sed steps here
          sed -i "s|newTag:.*|newTag: \"$NEW_TAG\"|g" "k8s/overlays/$TARGET_OVERLAY/kustomization.yaml"
          git diff
          # Git commit and push back
          git config user.email "pgc-builder@umn.edu"
          git config user.name "PGC Builder"
          git add .
          git commit -m "chore(dev): update tag to $NEW_TAG"
          git fetch origin
          git rebase origin/main
          git status
          git push origin HEAD:main